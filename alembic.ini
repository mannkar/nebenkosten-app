[alembic]
# Ort der Migrationsskripte. Die tatsaechliche Datenbank-URL wird NICHT hier
# hinterlegt, sondern in alembic/env.py dynamisch aus app/database.py
# (bzw. der Umgebungsvariable NK_DATA_DIR) ermittelt - so bleibt genau eine
# Quelle der Wahrheit fuer den DB-Pfad, egal ob lokal oder im Container.
script_location = migrations
version_path_separator = os
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
